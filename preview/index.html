<!doctype html><html lang="en"><meta charset="utf-8"><title>FairBuy UI preview</title><style>body{margin:0;background:#f7f8f3;font:16px system-ui}nav{position:sticky;top:0;display:flex;gap:12px;padding:16px;background:white;border-bottom:1px solid #ddd}button{padding:10px 22px;border:1px solid #879e75;border-radius:6px;background:white;cursor:pointer}button.active{background:#294a32;color:white}img{display:block;width:100%;height:auto}p{margin:0;padding:10px 16px;color:#52604f}</style><nav><button data-page="ask" class="active">Ask</button><button data-page="configure">Configure</button><button data-page="discovery">Discover</button><button data-page="buy">Buy</button></nav><p>UI screenshots with a completed fictional demo session. Click a tab to view each page; these images are not interactive.</p><img src="ask.png" alt="Ask page"><script>document.querySelectorAll('button').forEach(button=>button.onclick=()=>{document.querySelector('img').src=button.dataset.page+'.png';document.querySelector('img').alt=button.textContent+' page';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));window.scrollTo(0,0)});</script></html>

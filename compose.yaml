services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fairbuy
      POSTGRES_USER: fairbuy
      POSTGRES_PASSWORD: fairbuy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fairbuy-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairbuy -d fairbuy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fairbuy-postgres:

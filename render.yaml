# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Keep the existing Virginia service in Render "My Workspace".
# PostgreSQL is hosted by Supabase; do not provision a Render database.
projects:
  - name: fairbuy
    environments:
      - name: production
        services:
          - type: web
            name: fairbuy
            runtime: node
            repo: https://github.com/meta-hackers/fairbuy
            region: virginia
            plan: free
            numInstances: 1
            # Build tools are devDependencies, including with NODE_ENV=production.
            buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
            # Free services migrate after listening. /healthz is liveness.
            startCommand: node --env-file-if-exists=.env --env-file-if-exists=.env.backoffice backend/dist/main.js
            healthCheckPath: /healthz
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_VERSION
                value: 24.22.1
              - key: NODE_ENV
                value: production
              - key: FAIRBUY_MODE
                value: live
              - key: DATABASE_URL
                sync: false
              - key: MODEL_API_KEY
                sync: false
              - key: INSTANT_CLASSIFIER_PROVIDER
                value: cloudflare
              - key: INSTANT_CLASSIFIER_MODEL
                value: '@cf/meta/llama-3.1-8b-instruct-fp8-fast'
              - key: CLOUDFLARE_ACCOUNT_ID
                sync: false
              - key: CLOUDFLARE_API_TOKEN
                sync: false
              - key: ASK_MODEL
                value: muse-spark-1.3-contributor
              - key: CONFIGURE_MODEL
                value: muse-spark-1.3-contributor
              - key: DISCOVERY_MODEL
                # Managed directly in Render: muse-spark-1.3-contributor.
                # Blueprint syncs must not overwrite the operator's choice.
                sync: false
              - key: SELLER_SEARCH_MODEL
                value: muse-spark-1.3-contributor
              - key: ASK_REASONING_EFFORT
                value: minimal
              - key: CONFIGURE_REASONING_EFFORT
                value: low
              - key: DISCOVERY_REASONING_EFFORT
                value: medium
              - key: SELLER_SEARCH_REASONING_EFFORT
                value: medium
              - key: SEARCH_PROVIDER
                value: meta
              - key: BRAVE_API_KEY
                sync: false
              - key: BRAVE_MIN_INTERVAL_MS
                value: "1100"
              - key: CATALOG_URL
                value: https://meta-hackers.github.io/fairbuy-sources-catalog/sources.json
              - key: CATALOG_SYNC_ON_START
                value: "false"
              - key: APP_ACCESS_TOKEN
                sync: false
              - key: BACKOFFICE_ADMINS
                sync: false

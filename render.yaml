# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Active deployment: the existing "fairbuy" Blueprint in Render "My Workspace".
# Reuse that Blueprint/service; do not create a duplicate in another workspace.
# Workspace ownership is set in Render, not by the project name below.
# Keep the web service in Virginia for Meta Model API access.
# PostgreSQL is hosted by Supabase; do not provision a Render database.
projects:
  - name: fairbuy
    environments:
      - name: production
        services:
          - type: web
            name: fairbuy
            runtime: node
            repo: https://github.com/meta-hackers/fairbuy
            region: virginia
            plan: free
            numInstances: 1
            # Render injects NODE_ENV=production into the build too, and `npm ci`
            # then omits devDependencies. TypeScript, Vite and the React type
            # packages are build-only, so they must be installed explicitly;
            # prune them again afterwards to keep the runtime image small.
            buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
            # Free services do not support preDeployCommand; the app listens first,
            # then migrates with retry. /healthz is liveness, /health is readiness.
            # Never set PORT manually: Render injects it (normally 10000).
            startCommand: node --env-file-if-exists=.env --env-file-if-exists=.env.backoffice backend/dist/main.js
            healthCheckPath: /healthz
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_VERSION
                value: 24.22.1
              - key: NODE_ENV
                value: production
              - key: FAIRBUY_MODE
                value: live
              - key: DATABASE_URL
                # Supabase Session pooler (IPv4, port 5432), verified TLS,
                # dedicated fairbuy_app role with the private fairbuy schema.
                sync: false
              - key: MODEL_API_KEY
                sync: false
              - key: INSTANT_CLASSIFIER_PROVIDER
                value: cloudflare
              - key: INSTANT_CLASSIFIER_MODEL
                value: '@cf/meta/llama-3.1-8b-instruct-fp8'
              - key: CLOUDFLARE_ACCOUNT_ID
                sync: false
              - key: CLOUDFLARE_API_TOKEN
                sync: false
              - key: ASK_MODEL
                value: muse-spark-1.3-contributor
              - key: CONFIGURE_MODEL
                value: muse-spark-1.3-contributor
              - key: DISCOVERY_MODEL
                value: muse-spark-1.3-contributor
              - key: ASK_REASONING_EFFORT
                value: minimal
              - key: CONFIGURE_REASONING_EFFORT
                value: low
              - key: DISCOVERY_REASONING_EFFORT
                value: high
              - key: SEARCH_PROVIDER
                value: brave
              - key: BRAVE_API_KEY
                sync: false
              - key: CATALOG_URL
                value: https://meta-hackers.github.io/fairbuy-sources-catalog/sources.json
              - key: CATALOG_SYNC_ON_START
                value: "false"
              - key: APP_ACCESS_TOKEN
                sync: false # preserve the app password; never commit it
              - key: BACKOFFICE_ADMINS
                sync: false # JSON array of usernames with password or passwordHash; configure privately in Render

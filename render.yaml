# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free-tier Blueprint matching the live deployment. Deploy the web service in
# Virginia: Meta Model API returned model_not_found from Frankfurt (it is not
# enabled for EU-hosted callers yet). The PostgreSQL instance is NOT
# Blueprint-managed: only one free database per workspace is allowed and the
# live data already sits on it, so paste its connection string below.
services:
  - type: web
    name: fairbuy
    runtime: node
    repo: https://github.com/meta-hackers/fairbuy
    region: virginia
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: FAIRBUY_MODE
        value: live
      - key: DATABASE_URL
        sync: false # same-region DB: paste its internal connection string. Cross-region (e.g. existing Frankfurt DB): paste the external string + ?sslmode=require and allow this service's outbound IPs on the database.
      - key: MODEL_API_KEY
        sync: false
      - key: ASK_MODEL
        value: muse-spark-1.3-contributor
      - key: CONFIGURE_MODEL
        value: muse-spark-1.3-contributor
      - key: DISCOVERY_MODEL
        value: muse-spark-1.3-contributor
      - key: REASONING_EFFORT
        value: medium
      - key: SEARCH_PROVIDER
        value: meta
      - key: APP_ACCESS_TOKEN
        sync: false # set a fixed, memorable app password in Render; do not commit it
# No databases: section on purpose. Render allows a single free PostgreSQL
# database per workspace and the live one already exists outside this
# Blueprint, so DATABASE_URL above is wired manually to it.

# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free-tier Blueprint matching the live deployment. The PostgreSQL instance is
# NOT Blueprint-managed: only one free database per workspace is allowed and the
# live data already sits on it, so paste its internal connection string below.
services:
  - type: web
    name: fairbuy
    runtime: node
    repo: https://github.com/meta-hackers/fairbuy
    region: frankfurt
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: FAIRBUY_MODE
        value: live
      - key: DATABASE_URL
        sync: false # paste the internal connection string of the existing free PostgreSQL instance (dbname fairbuy)
      - key: MODEL_API_KEY
        sync: false
      - key: ASK_MODEL
        value: muse-spark-1.3-contributor
      - key: CONFIGURE_MODEL
        value: muse-spark-1.3-contributor
      - key: DISCOVERY_MODEL
        value: muse-spark-1.3-contributor
      - key: REASONING_EFFORT
        value: medium
      - key: SEARCH_PROVIDER
        value: meta
      - key: APP_ACCESS_TOKEN
        generateValue: true
# No databases: section on purpose. Render allows a single free PostgreSQL
# database per workspace and the live one already exists outside this
# Blueprint, so DATABASE_URL above is wired manually to it.
